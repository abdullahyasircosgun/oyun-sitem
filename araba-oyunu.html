<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Grand Theft Web VI: Party Mode IJKL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* ARAYÜZ (UI) */
        #ui {
            display: none; position: absolute; top: 20px; left: 20px; color: white;
            font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #00d2ff;
            pointer-events: none; z-index: 20; gap: 20px;
        }

        /* ELENME BİLDİRİMİ */
        #elimination-msg {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            font-size: 40px; font-weight: 900; color: #bf2121;
            text-shadow: 0 0 20px black; text-transform: uppercase;
            opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 40;
            background: rgba(0,0,0,0.6); padding: 10px 30px; border-radius: 10px;
            border: 2px solid #bf2121;
        }

        /* GİRİŞ MENÜSÜ */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50;
        }
        h1 {
            color: #d800ff; text-transform: uppercase; font-size: 60px; margin-bottom: 10px;
            text-shadow: 4px 4px #00d2ff; letter-spacing: 5px; font-style: italic;
        }
        .menu-btn {
            background: linear-gradient(45deg, #222, #444);
            border: 2px solid #555; color: white;
            padding: 15px 40px; margin: 10px;
            font-size: 24px; font-weight: bold; cursor: pointer;
            width: 300px; text-transform: uppercase;
            transition: 0.2s; clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
        }
        .menu-btn:hover { background: #d800ff; color: black; border-color: white; transform: scale(1.05); }

        /* BİLGİ KUTUSU */
        #info {
            display: none; position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.9);
            font-size: 13px; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px;
            border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        /* WASTED EKRANI */
        #wasted {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: #bf2121;
            justify-content: center; align-items: center; flex-direction: column;
            font-size: 90px; font-weight: 900; letter-spacing: 5px;
            text-shadow: 0 0 30px #bf2121; z-index: 30;
        }
        #wastedInfo {
            font-size: 30px; color: white; margin-top: 10px; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px white;
        }
        #restartBtn {
            padding: 15px 40px; font-size: 24px;
            background: white; border: none; cursor: pointer; text-transform: uppercase;
            font-weight: bold; border-radius: 5px; box-shadow: 0 0 20px #bf2121;
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=cyberpunk-2099-10586.mp3" type="audio/mpeg">
</audio>

<div id="elimination-msg">OYUNCU ELENDİ!</div>

<div id="menu">
    <h1>SURVIVAL PARTY</h1>
    <h3 style="color:white; margin-bottom:30px;">SONA KALAN KAZANIR!</h3>
    <button class="menu-btn" onclick="startGame(1)">1 OYUNCU</button>
    <button class="menu-btn" onclick="startGame(2)">2 OYUNCU</button>
    <button class="menu-btn" onclick="startGame(3)">3 OYUNCU</button>
    <button class="menu-btn" onclick="startGame(4)">4 OYUNCU</button>
</div>

<div id="ui">
    <span>KASA: $<span id="score">0</span></span>
    <span style="font-size: 18px; color: #aaa; margin-top:5px"> | ZORLUK: <span id="level">1</span></span>
    <span style="font-size: 18px; color: #4caf50; margin-top:5px"> | KALAN: <span id="aliveCount">0</span></span>
</div>

<div id="info" style="display: none;"></div>

<div id="wasted">
    OYUN BİTTİ
    <div id="wastedInfo">HERKES ÖLDÜ!</div>
    <button id="restartBtn" onclick="location.reload()">MENÜYE DÖN</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gameActive = false;
    let gameOver = false;
    let score = 0;
    let frameCount = 0;
    
    const keys = {};
    // Türkçe karakter uyumluluğu (I ve İ karışıklığını önler, 'ı' olarak algılar)
    window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

    function showElimination(name, color) {
        const el = document.getElementById('elimination-msg');
        el.innerText = name + " ELENDİ!";
        el.style.color = color;
        el.style.borderColor = color;
        el.style.opacity = 1;
        setTimeout(() => { el.style.opacity = 0; }, 2000);
    }

    // --- OYUNCU SINIFI ---
    class Player {
        constructor(x, y, color, name, controls) {
            this.x = x; this.y = y;
            this.vx = 0; this.vy = 0;
            this.angle = 0;
            this.width = 22; this.height = 40;
            this.color = color;
            this.name = name;
            this.controls = controls;
            this.acc = 0.4; this.friction = 0.96; this.turnSpeed = 0.07; this.maxSpeed = 13;
            this.alive = true;
        }

        kill() {
            if(!this.alive) return;
            this.alive = false;
            showElimination(this.name, this.color);
            checkGameOver();
        }

        update() {
            if(!this.alive) return;

            // Kontroller
            let up = keys[this.controls.up];
            let down = keys[this.controls.down];
            let left = keys[this.controls.left];
            let right = keys[this.controls.right];

            if (up) { this.vx += Math.sin(this.angle) * this.acc; this.vy -= Math.cos(this.angle) * this.acc; }
            if (down) { this.vx -= Math.sin(this.angle) * (this.acc / 1.2); this.vy += Math.cos(this.angle) * (this.acc / 1.2); }

            let speed = Math.hypot(this.vx, this.vy);
            if (speed > this.maxSpeed) { this.vx *= (this.maxSpeed / speed); this.vy *= (this.maxSpeed / speed); }
            if (speed > 0.5) {
                let dir = 0; if (left) dir = -1; if (right) dir = 1;
                let reverseFactor = down ? -1 : 1; 
                this.angle += dir * this.turnSpeed * reverseFactor;
            }

            this.vx *= this.friction; this.vy *= this.friction;
            this.x += this.vx; this.y += this.vy;

            let moveAngle = Math.atan2(this.vy, this.vx) + Math.PI/2;
            if(speed > 4 && Math.abs(moveAngle - this.angle) > 0.4) {
                 if(frameCount % 4 === 0) skidMarks.push({x: this.x, y: this.y, angle: this.angle, life: 80});
            }

            this.x = Math.max(0, Math.min(canvas.width, this.x));
            this.y = Math.max(0, Math.min(canvas.height, this.y));
        }
    }

    let players = [];
    const policeCars = [];
    const trafficCars = []; 
    const cashItems = [];
    let skidMarks = [];

    function startGame(count) {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('ui').style.display = 'flex';
        document.getElementById('info').style.display = 'grid';
        
        // Müziği Başlat
        const audio = document.getElementById('bgMusic');
        audio.volume = 0.4;
        audio.play().catch(e => console.log("Otomatik başlatma engellendi"));

        let infoHTML = "";
        
        // P1
        if(count >= 1) { 
            players.push(new Player(canvas.width/2 - 40, canvas.height/2, '#00d2ff', 'MAVİ', {up:'w', down:'s', left:'a', right:'d'})); 
            infoHTML += `<div style="color:#00d2ff">P1: WASD</div>`; 
        }
        // P2
        if(count >= 2) { 
            players.push(new Player(canvas.width/2 + 40, canvas.height/2, '#ff8c00', 'TURUNCU', {up:'arrowup', down:'arrowdown', left:'arrowleft', right:'arrowright'})); 
            infoHTML += `<div style="color:#ff8c00">P2: OKLAR</div>`; 
        }
        // P3
        if(count >= 3) { 
            players.push(new Player(canvas.width/2 - 80, canvas.height/2 + 60, '#00ff00', 'YEŞİL', {up:'5', down:'2', left:'1', right:'3'})); 
            infoHTML += `<div style="color:#00ff00">P3: NUMPAD 1235</div>`; 
        }
        // P4 (I J K L) - Türkçe 'ı' olarak tanımlandı
        if(count >= 4) { 
            players.push(new Player(canvas.width/2 + 80, canvas.height/2 + 60, '#ff00ff', 'PEMBE', {up:'ı', down:'k', left:'j', right:'l'})); 
            infoHTML += `<div style="color:#ff00ff">P4: I J K L</div>`; 
        }
        
        document.getElementById('info').innerHTML = infoHTML;
        gameActive = true;
        checkGameOver();
        draw();
    }

    function checkGameOver() {
        let aliveCount = players.filter(p => p.alive).length;
        document.getElementById('aliveCount').innerText = aliveCount;
        if(aliveCount === 0) {
            gameOver = true;
            document.getElementById('wasted').style.display = 'flex';
        }
    }

    function spawnTraffic() {
        if(frameCount % 120 === 0) {
            let laneOffset = 50; 
            trafficCars.push({ x: canvas.width/2 - laneOffset, y: -100, width: 22, height: 42, speed: 6, dir: 1, color: getRandomCarColor(), angle: Math.PI });
            trafficCars.push({ x: canvas.width/2 + laneOffset, y: canvas.height + 100, width: 22, height: 42, speed: 6, dir: -1, color: getRandomCarColor(), angle: 0 });
        }
    }
    
    function getRandomCarColor() {
        const colors = ['#555', '#7a2828', '#283c7a', '#3e4a3e', '#707070', '#8c8c8c'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function spawnPolice() {
        let aliveCount = players.filter(p => p.alive).length;
        if(aliveCount === 0) return;

        let difficulty = Math.floor(score / 500);
        let maxPolice = 2 + difficulty + aliveCount; 
        document.getElementById('level').innerText = difficulty + 1;
        if(maxPolice > 25) maxPolice = 25;

        if(policeCars.length < maxPolice) {
            let rand = Math.random();
            let type = 'car';
            let baseSpeed = 6.5 + (difficulty * 0.2); 
            let w = 24, h = 42;
            let color = '#fff';
            let traction = 0.25; let friction = 0.96;
            let volatility = 0.2; let changeRate = 100;

            if(rand < 0.2) { 
                type = 'swat'; baseSpeed *= 0.8; w = 35; h = 70; color = '#1a2b4c'; 
                traction = 0.15; friction = 0.98; volatility = 0.05; changeRate = 200;
            }
            else if(rand > 0.8) { 
                type = 'bike'; baseSpeed *= 1.25; w = 12; h = 25; color = '#ccc';
                traction = 0.4; friction = 0.94; volatility = 0.4; changeRate = 40;
            }

            policeCars.push({
                x: Math.random() < 0.5 ? -100 : canvas.width + 100,
                y: Math.random() * canvas.height,
                vx: 0, vy: 0,
                width: w, height: h,
                type: type, angle: 0, 
                baseSpeed: baseSpeed, maxSpeed: baseSpeed, 
                speedTimer: Math.random() * changeRate,
                changeRate: changeRate, volatility: volatility,
                traction: traction, friction: friction, stunned: 0, color: color
            });
        }
    }

    function update() {
        if (!gameActive || gameOver) return;
        frameCount++;

        players.forEach(p => p.update());

        spawnTraffic();
        for(let i=trafficCars.length-1; i>=0; i--) {
            let t = trafficCars[i];
            t.y += t.speed * t.dir;
            if(t.y > canvas.height + 200 || t.y < -200) { trafficCars.splice(i, 1); continue; }
            players.forEach(p => {
                if(!p.alive) return;
                let dist = Math.hypot(p.x - t.x, p.y - t.y);
                if(dist < (p.width + t.width)/2 + 5) p.kill();
            });
        }

        spawnPolice();
        policeCars.forEach(p => {
            if(p.stunned > 0) { p.stunned--; p.vx *= 0.9; p.vy *= 0.9; p.x += p.vx; p.y += p.vy; return; }

            p.speedTimer--;
            if (p.speedTimer <= 0) {
                let factor = 1.0 + (Math.random() * p.volatility * 2 - p.volatility);
                p.maxSpeed = p.baseSpeed * factor;
                p.speedTimer = p.changeRate * (0.5 + Math.random());
            }

            let livingPlayers = players.filter(pl => pl.alive);
            if(livingPlayers.length === 0) return;

            let target = livingPlayers[0];
            let minDist = Infinity;
            livingPlayers.forEach(player => {
                let d = Math.hypot(player.x - p.x, player.y - p.y);
                if (d < minDist) { minDist = d; target = player; }
            });

            let dx = target.x - p.x;
            let dy = target.y - p.y;
            let targetDistance = minDist;
            let targetAngle = Math.atan2(dy, dx) + Math.PI / 2;
            
            let diff = targetAngle - p.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            
            let turnPower = 0.08;
            if(targetDistance < 200 && Math.abs(diff) > 0.5) { turnPower = 0.15; }
            p.angle += diff * turnPower;

            let throttle = p.traction;
            let currentFriction = p.friction;

            if (targetDistance < 180 && Math.abs(diff) > 0.3) {
                throttle *= 0.2; currentFriction = 0.92;
            } else if (Math.abs(diff) < 0.2) {
                throttle *= 1.2;
            }

            p.vx += Math.sin(p.angle) * throttle;
            p.vy -= Math.cos(p.angle) * throttle;

            let currentSpeed = Math.hypot(p.vx, p.vy);
            if(currentSpeed > p.maxSpeed) {
                 p.vx *= (p.maxSpeed / currentSpeed);
                 p.vy *= (p.maxSpeed / currentSpeed);
            }

            p.vx *= currentFriction; p.vy *= currentFriction;
            p.x += p.vx; p.y += p.vy;

            let moveAngle = Math.atan2(p.vy, p.vx) + Math.PI/2;
            if(Math.abs(moveAngle - p.angle) > 0.4 && currentSpeed > 3) {
                if(frameCount % 5 === 0) skidMarks.push({x: p.x, y: p.y, angle: p.angle, life: 60});
            }

            trafficCars.forEach(t => {
                let dist = Math.hypot(p.x - t.x, p.y - t.y);
                if(dist < (p.width + t.width)/2 + 2) {
                    p.stunned = 120; p.vx = -p.vx * 0.5; p.vy = -p.vy * 0.5;
                }
            });

            players.forEach(player => {
                if(!player.alive) return;
                let dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < (player.width + p.width) / 2) player.kill();
            });
        });

        if(cashItems.length < 5) { cashItems.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height }); }
        for(let i=cashItems.length-1; i>=0; i--){
            let c = cashItems[i];
            let collected = false;
            players.forEach(p => { if(p.alive && Math.hypot(p.x - c.x, p.y - c.y) < 40) collected = true; });
            if(collected) { score += 100; document.getElementById('score').innerText = score; cashItems.splice(i,1); }
        }

        for(let i=skidMarks.length-1; i>=0; i--) {
            skidMarks[i].life--; if(skidMarks[i].life <= 0) skidMarks.splice(i,1);
        }
    }

    function drawHeadlights(ctx, car) {
        ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
        ctx.globalCompositeOperation = 'screen';
        let grad = ctx.createLinearGradient(0, -car.height/2, 0, -car.height/2 - 250);
        grad.addColorStop(0, 'rgba(255, 255, 200, 0.6)'); grad.addColorStop(1, 'rgba(255, 255, 200, 0)');
        ctx.fillStyle = grad; ctx.beginPath();
        ctx.moveTo(-10, -car.height/2); ctx.lineTo(-60, -car.height/2 - 250); ctx.lineTo(60, -car.height/2 - 250); ctx.lineTo(10, -car.height/2);
        ctx.fill(); ctx.restore();
    }

    function drawCar(ctx, c, type) {
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
        let shake = 0; if(c.stunned && c.stunned > 0) shake = (Math.random()-0.5) * 5;

        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-c.width/2+4+shake, -c.height/2+4+shake, c.width, c.height); 
        ctx.fillStyle = c.color;
        
        if (type === 'bike') {
            ctx.fillRect(-c.width/2+shake, -c.height/2+shake, c.width, c.height);
            ctx.fillStyle = '#333'; ctx.fillRect(-2+shake, -c.height/2-5+shake, 4, 10); ctx.fillRect(-2+shake, c.height/2-5+shake, 4, 10);
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(shake, shake, 5, 0, Math.PI*2); ctx.fill();
        } else if (type === 'swat') {
            ctx.fillRect(-c.width/2+shake, -c.height/2+shake, c.width, c.height);
            ctx.fillStyle = 'white'; ctx.font = 'bold 10px Arial'; ctx.fillText('SWAT', -15+shake, 5+shake);
        } else {
            ctx.fillRect(-c.width/2+shake, -c.height/2+shake, c.width, c.height);
            ctx.fillStyle = '#111'; ctx.fillRect(-c.width/2+2+shake, -c.height/2+5+shake, c.width-4, 6); ctx.fillRect(-c.width/2+2+shake, c.height/2-10+shake, c.width-4, 5);
        }

        if(type === 'police' || type === 'swat' || type === 'bike') {
            if(c.stunned > 0) {
                 ctx.fillStyle = '#555'; ctx.fillRect(-c.width/2+shake, -c.height/2+shake, c.width, 5);
            } else {
                let phase = Math.floor(Date.now()/80)%2;
                let c1 = phase===0?'red':'blue'; let c2 = phase===0?'blue':'red';
                if(type==='bike') { ctx.fillStyle=c1; ctx.fillRect(-4, c.height/2, 8, 4); }
                else { ctx.fillStyle=c1; ctx.fillRect(-c.width/2, -c.height/2, c.width/2, 5); ctx.fillStyle=c2; ctx.fillRect(0, -c.height/2, c.width/2, 5); }
            }
        } else if (type === undefined) { // Player
            ctx.fillStyle = '#ffeda0'; ctx.fillRect(-c.width/2+2, -c.height/2, 5, 3); ctx.fillRect(c.width/2-7, -c.height/2, 5, 3);
        } else if (type === 'traffic') {
            ctx.fillStyle = '#aaa'; ctx.fillRect(-c.width/2+2, -c.height/2, 5, 3); ctx.fillRect(c.width/2-7, -c.height/2, 5, 3);
            ctx.fillStyle = '#500'; ctx.fillRect(-c.width/2+2, c.height/2-2, 5, 3); ctx.fillRect(c.width/2-7, c.height/2-2, 5, 3);
        }
        ctx.restore();
    }

    function draw() {
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let mid = canvas.width / 2;
        ctx.fillStyle = '#222'; ctx.fillRect(mid - 100, 0, 200, canvas.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(mid - 100, 0, 5, canvas.height); ctx.fillRect(mid + 95, 0, 5, canvas.height);
        ctx.fillStyle = '#e5b80b'; 
        let dashHeight = 40; let gap = 30;
        for(let y = -(frameCount*6)% (dashHeight+gap); y < canvas.height; y += (dashHeight+gap)) {
            ctx.fillRect(mid - 2, y, 4, dashHeight);
        }

        skidMarks.forEach(m => {
            ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.angle);
            ctx.fillStyle = `rgba(30,30,30, ${m.life/100})`; ctx.fillRect(-10, -10, 5, 20); ctx.fillRect(5, -10, 5, 20); ctx.restore();
        });

        cashItems.forEach(c => {
            ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle='white'; ctx.font='12px Arial'; ctx.fillText('$', c.x-3, c.y+4);
        });

        trafficCars.forEach(t => drawCar(ctx, t, 'traffic'));
        
        players.forEach(p => {
            if(p.alive) {
                drawHeadlights(ctx, p);
                drawCar(ctx, p);
            }
        });
        
        policeCars.forEach(p => drawCar(ctx, p, p.type === 'bike' ? 'bike' : (p.type==='swat'?'swat':'police')));

        requestAnimationFrame(() => { update(); draw(); });
    }

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

</script>
</body>
</html>
