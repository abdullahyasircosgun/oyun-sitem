<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Yılan Oyunu</title>
    <style>
        /* CSS: Tasarım ve Görsellik */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none; /* Metin seçimini engelle */
        }

        h1 {
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #111;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(2px);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .score-box {
            background: #222;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #444;
        }

        span#score-val { color: #00ffcc; }
        span#high-score-val { color: #ff0055; }

        button {
            background: linear-gradient(45deg, #00ffcc, #00ccaa);
            border: none;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 0 15px #00ffcc;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00ffcc;
        }

        button:active {
            transform: scale(0.95);
        }

        #game-message {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }
        
        #controls-hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="score-board">
        <div class="score-box">SKOR: <span id="score-val">0</span></div>
        <div class="score-box">REKOR: <span id="high-score-val">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="ui-layer">
            <div id="game-message">NEON SNAKE</div>
            <button id="start-btn" onclick="startGame()">OYNA</button>
            <div id="controls-hint">Yön Tuşları veya W-A-S-D ile oyna</div>
        </div>
    </div>

    <script>
        /* JS: Oyun Mantığı */
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const gameMessage = document.getElementById('game-message');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score-val');
        const highScoreEl = document.getElementById('high-score-val');

        // Ayarlar
        const tileCount = 20; // 20x20 ızgara
        const gridSize = canvas.width / tileCount; // Her karenin boyutu (20px)
        const gameSpeed = 100; // Milisaniye cinsinden hız (daha düşük = daha hızlı)

        // Oyun Değişkenleri
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let snake = [];
        let food = { x: 0, y: 0 };
        
        // Hız (Velocity) X ve Y
        let dx = 0;
        let dy = 0;
        
        let gameInterval;
        let isGameRunning = false;
        
        // Bug Önleme: Aynı kare içinde birden fazla tuşa basılmasını engellemek için
        let lastInputDirection = { x: 0, y: 0 }; 

        // Başlangıçta rekoru yazdır
        highScoreEl.innerText = highScore;

        // Klavye Dinleyicisi
        document.addEventListener('keydown', changeDirection);

        function startGame() {
            // Oyunu sıfırla
            snake = [{ x: 10, y: 10 }]; // Yılan ortada başlar
            dx = 0; // Hareket yok
            dy = 0;
            lastInputDirection = { x: 0, y: 0 };
            score = 0;
            scoreEl.innerText = score;
            
            // UI gizle
            uiLayer.classList.add('hidden');
            isGameRunning = true;
            
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            if (!isGameRunning) return;

            // Yılanın başının yeni pozisyonunu hesapla
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Çarpışma Kontrolü (Duvarlar)
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Çarpışma Kontrolü (Kendisi)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    // Sadece hareket ediyorsak çarpışma sayılır (dururken değil)
                    if (dx !== 0 || dy !== 0) {
                        gameOver();
                        return;
                    }
                }
            }

            // Yeni başı ekle
            snake.unshift(head);

            // Yemek yedi mi?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                spawnFood();
                // Kuyruk silinmez, yılan uzar
            } else {
                // Yemek yemedi, kuyruğu sil (hareket efekti)
                // Eğer hareket etmiyorsa (başlangıç durumu), kuyruk silme işlemi yapma
                if (dx !== 0 || dy !== 0) {
                    snake.pop();
                } else {
                    // Başlangıçta yılanın uzamasını engellemek için pop yapıyoruz çünkü unshift yaptık
                    snake.pop(); 
                }
            }
            
            // Girdi tamponunu güncelle
            lastInputDirection = { x: dx, y: dy };

            draw();
        }

        function draw() {
            // Arkaplanı temizle
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yılanı çiz
            for (let i = 0; i < snake.length; i++) {
                // Baş kısmı farklı renk
                ctx.fillStyle = (i === 0) ? '#00ffcc' : '#00997a';
                
                // Hafif parlama efekti (Shadow)
                ctx.shadowBlur = (i === 0) ? 15 : 0;
                ctx.shadowColor = "#00ffcc";

                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
                
                // Shadow'u sıfırla ki diğer çizimleri etkilemesin
                ctx.shadowBlur = 0;
            }

            // Yemeği çiz
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }

        function spawnFood() {
            // Yılanın üzerine gelmeyecek rastgele bir konum bul
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                validPosition = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function changeDirection(event) {
            if (!isGameRunning) return;

            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;
            
            const A_KEY = 65;
            const W_KEY = 87;
            const D_KEY = 68;
            const S_KEY = 83;

            // Mevcut hareket yönünü kontrol et (geri dönmeyi engelle)
            // lastInputDirection kullanıyoruz ki hızlı tuşlamalarda bug olmasın
            
            const goingUp = lastInputDirection.y === -1;
            const goingDown = lastInputDirection.y === 1;
            const goingRight = lastInputDirection.x === 1;
            const goingLeft = lastInputDirection.x === -1;

            if ((keyPressed === LEFT || keyPressed === A_KEY) && !goingRight) {
                dx = -1; dy = 0;
            }
            if ((keyPressed === UP || keyPressed === W_KEY) && !goingDown) {
                dx = 0; dy = -1;
            }
            if ((keyPressed === RIGHT || keyPressed === D_KEY) && !goingLeft) {
                dx = 1; dy = 0;
            }
            if ((keyPressed === DOWN || keyPressed === S_KEY) && !goingUp) {
                dx = 0; dy = 1;
            }
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameInterval);

            // Rekor kontrolü
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.innerText = highScore;
                gameMessage.innerText = "YENİ REKOR!";
            } else {
                gameMessage.innerText = "KAYBETTİN";
            }
            
            startBtn.innerText = "TEKRAR DENE";
            uiLayer.classList.remove('hidden');
        }
    </script>
</body>
</html>
